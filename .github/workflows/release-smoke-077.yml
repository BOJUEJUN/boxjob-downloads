name: release-smoke-077

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download package and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.7-city-playtest"
          curl.exe -sSL --retry 3 -o "$env:RUNNER_TEMP\BoxJob-City-077-Windows.zip" "$base/BoxJob-City-077-Windows.zip"
          curl.exe -sSL --retry 3 -o "$env:RUNNER_TEMP\SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          $h = (Get-FileHash "$env:RUNNER_TEMP\BoxJob-City-077-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "zip sha256: $h"
          $line = Get-Content "$env:RUNNER_TEMP\SHA256SUMS.txt" | Where-Object { $_ -match "Windows" }
          $expected = $line.Split(" ")[0].ToLower()
          if ($h -ne $expected) { throw "hash mismatch: $h vs $expected" }
          Write-Host "hash OK"
      - name: Extract and list payload
        shell: pwsh
        run: |
          Expand-Archive "$env:RUNNER_TEMP\BoxJob-City-077-Windows.zip" -DestinationPath "$env:RUNNER_TEMP\bj077" -Force
          $exe = "$env:RUNNER_TEMP\bj077\Windows\BoxJob City 077.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          Get-ChildItem "$env:RUNNER_TEMP\bj077\Windows" | Select-Object Name,Length | Format-Table -AutoSize
      - name: Headless runtime smoke
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\bj077\Windows\BoxJob City 077.exe"
          $log = "$env:RUNNER_TEMP\smoke.log"
          $err = "$env:RUNNER_TEMP\smoke.err.log"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -WindowStyle Minimized -ArgumentList @("--headless","--quit-after","900") -RedirectStandardOutput $log -RedirectStandardError $err
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "smoke timeout" }
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host "--- stdout tail ---"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          Write-Host "--- stderr tail ---"
          if (Test-Path $err) { Get-Content $err -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "nonzero exit" }
          $text = ""
          if (Test-Path $log) { $text += (Get-Content $log -Raw) }
          if (Test-Path $err) { $text += (Get-Content $err -Raw) }
          if ($text -match "SCRIPT ERROR" -or $text -match "Parse Error" -or $text -match "Failed to load script") { throw "script errors in log" }
          Write-Host "headless smoke OK"
      - name: Old release assets reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @(
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.6-city-playtest/BoxJob-City-076-Mac.zip",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.6-city-playtest/BoxJob-City-076-Windows.zip",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.6-city-playtest/SHA256SUMS.txt",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.5-city-playtest/BoxJob-City-075-Mac.zip",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.5-city-playtest/BoxJob-City-075-Windows.zip",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.5-city-playtest/SHA256SUMS.txt",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.6.6/BoxJob-Mac-v0.6.6.zip",
            "https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.6.6/BoxJob-Windows-v0.6.6.zip"
          )
          foreach ($u in $urls) {
            $out = curl.exe -sSL --retry 2 -o NUL -w "%{http_code} %{size_download}" $u
            Write-Host "$u -> $out"
            if (-not $out.StartsWith("200")) { throw "asset failed: $u" }
          }
          Write-Host "old assets OK"

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download package and checksums
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/BOJUEJUN/boxjob-downloads/releases/download/v0.7.7-city-playtest"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/BoxJob-City-077-Mac.zip" "$base/BoxJob-City-077-Mac.zip"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          h="$(shasum -a 256 "$RUNNER_TEMP/BoxJob-City-077-Mac.zip" | awk '{print $1}')"
          echo "zip sha256: $h"
          expected="$(grep Mac "$RUNNER_TEMP/SHA256SUMS.txt" | awk '{print $1}')"
          if [ "$h" != "$expected" ]; then echo "hash mismatch: $h vs $expected"; exit 1; fi
          echo "hash OK"
      - name: Launch app headless
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bj077"
          ditto -x -k "$RUNNER_TEMP/BoxJob-City-077-Mac.zip" "$RUNNER_TEMP/bj077"
          app="$RUNNER_TEMP/bj077/macOS/BoxJob-City-077.app"
          bin="$app/Contents/MacOS/BoxJob City 077"
          if [ ! -x "$bin" ]; then echo "missing executable"; ls -la "$app/Contents/MacOS" || true; exit 1; fi
          "$bin" --headless --quit-after 900 >"$RUNNER_TEMP/smoke.log" 2>&1 || { echo "exit code $?"; tail -40 "$RUNNER_TEMP/smoke.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/smoke.log"
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/smoke.log"; then echo "script errors"; exit 1; fi
          echo "macos headless smoke OK"
